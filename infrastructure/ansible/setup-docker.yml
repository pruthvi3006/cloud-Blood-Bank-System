---
- name: Setup Docker on Blood Bank Server
  hosts: web
  become: yes

  tasks:

    - name: Update apt package cache
      apt:
        update_cache: yes
        cache_valid_time: 3600

    - name: Install required packages
      apt:
        name:
          - ca-certificates
          - curl
        state: present

    - name: Install Docker
      apt:
        name:
          - docker.io
          - docker-compose-v2
        state: present

    - name: Start Docker service
      service:
        name: docker
        state: started
        enabled: yes

    - name: Add ubuntu user to docker group
      user:
        name: ubuntu
        groups: docker
        append: yes
