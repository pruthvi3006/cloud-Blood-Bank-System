services:

  database:
    image: mysql:8.0
    container_name: bloodbank-database

    restart: unless-stopped

    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}

    volumes:
      - mysql_data:/var/lib/mysql
      - ./backend/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro

    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-u",
          "root",
          "-p${MYSQL_ROOT_PASSWORD}"
        ]
      interval: 10s
      timeout: 5s
      retries: 10


  backend:
    build:
      context: ./backend

    container_name: bloodbank-backend

    restart: unless-stopped

    environment:
      PORT: 4000
      DATABASE_URL: mysql://${MYSQL_USER}:${MYSQL_PASSWORD}@database:3306/${MYSQL_DATABASE}
      

    depends_on:
      database:
        condition: service_healthy

    volumes:
      - uploads_data:/app/uploads

    expose:
      - "4000"


  frontend:
    build:
      context: ./frontend

    container_name: bloodbank-frontend

    restart: unless-stopped

    ports:
      - "80:80"

    depends_on:
      - backend


volumes:
  mysql_data:
  uploads_data: