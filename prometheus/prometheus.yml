global:
  scrape_interval: 15s

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "ec2-server"
    static_configs:
      - targets: ["node-exporter:9100"]
  
  - job_name: "bloodbank-backend"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["backend:4000"]